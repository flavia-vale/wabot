<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot Conversor para Afiliados</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01","cv11";
    transition: background .4s ease, color .4s ease;
  }
  .serif{ font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  ::selection{ background: var(--accent-2); color: var(--ink); }

  /* Palette: lavanda (default) */
  :root, [data-palette="lavanda"]{
    --bg: #F7F3EE;
    --bg-soft: #EFEAE2;
    --surface: #FFFDFA;
    --ink: #2A2440;
    --ink-soft: #6B6486;
    --accent: #A78BFA;          /* lavanda */
    --accent-strong: #7C5CF5;
    --accent-2: #F4D9E0;        /* rosa pó */
    --accent-3: #C8E6D8;        /* verde água suave */
    --line: rgba(42,36,64,0.10);
    --shadow: 0 30px 60px -30px rgba(124,92,245,0.35), 0 8px 24px -8px rgba(42,36,64,0.08);
    --shadow-soft: 0 12px 30px -12px rgba(124,92,245,0.22);
  }
  [data-palette="pessego"]{
    --bg: #FBF1E7;
    --bg-soft: #F4E5D5;
    --surface: #FFFAF3;
    --ink: #2D2A26;
    --ink-soft: #6F6960;
    --accent: #E8A488;          /* pêssego */
    --accent-strong: #C77758;
    --accent-2: #BFC9A8;        /* sálvia */
    --accent-3: #F2D9C2;
    --line: rgba(45,42,38,0.10);
    --shadow: 0 30px 60px -30px rgba(199,119,88,0.30), 0 8px 24px -8px rgba(45,42,38,0.08);
    --shadow-soft: 0 12px 30px -12px rgba(199,119,88,0.20);
  }
  [data-palette="menta"]{
    --bg: #EEF6F2;
    --bg-soft: #DDEDE5;
    --surface: #FCFEFD;
    --ink: #1F2D2A;
    --ink-soft: #5A6E68;
    --accent: #7CC9A9;          /* menta */
    --accent-strong: #3E9C7A;
    --accent-2: #D9CFEA;        /* lilás */
    --accent-3: #F6E8D8;
    --line: rgba(31,45,42,0.10);
    --shadow: 0 30px 60px -30px rgba(62,156,122,0.30), 0 8px 24px -8px rgba(31,45,42,0.08);
    --shadow-soft: 0 12px 30px -12px rgba(62,156,122,0.20);
  }

  /* Density */
  [data-density="cozy"]{ --pad-section: 120px; --pad-card: 28px; --gap: 24px; }
  [data-density="compact"]{ --pad-section: 72px; --pad-card: 20px; --gap: 16px; }
  [data-density="airy"]{ --pad-section: 168px; --pad-card: 36px; --gap: 32px; }

  .wrap{ max-width: 1240px; margin: 0 auto; padding: 0 28px; }
  section{ padding: var(--pad-section, 120px) 0; }

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 600; font-size: 15px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
    text-decoration: none;
    line-height: 1;
  }
  .btn-primary{ background: var(--ink); color: var(--surface); }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: var(--shadow-soft); }
  .btn-ghost{ background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover{ background: var(--surface); }
  .btn-accent{ background: var(--accent-strong); color: white; }
  .btn-accent:hover{ transform: translateY(-1px); box-shadow: var(--shadow-soft); }

  .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding: 6px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 500;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .pill .dot{ width:6px; height:6px; border-radius:50%; background: var(--accent-strong); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 30%, transparent); }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: var(--pad-card, 28px);
  }

  h1,h2,h3,h4{ margin: 0; letter-spacing: -0.02em; }
  p{ margin: 0; }

  /* Subtle grain on bg */
  body::before{
    content:""; position: fixed; inset:0; pointer-events:none; z-index: 0;
    background-image: radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 4px 4px;
    opacity: .5;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(238,85,85,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(238,85,85,0); }
  }

  #app{ position: relative; z-index: 1; }

  /* Tweaks panel polish */
  .tweaks-panel{ font-family: 'Inter', system-ui, sans-serif !important; }
</style>
</head>
<body>
<div id="app"></div>
