document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Espelha Grupos · Design System v2<\u002Ftitle>\n<style>/* Espelha Grupos · Design System v2 — espelha dashboard/app/globals.css (:root) + dashboard/app/painel/painel.css (.pnl-root).\n   Regra: se divergir do código, vale o código. Tamanhos só em px (sem clamp / vw / rem). */\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 300 900;\n  font-display: swap;\n  src: url(\"6eeb4c3a-fdb9-4909-9963-4c29e27fdded\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 300 900;\n  font-display: swap;\n  src: url(\"12c06a4c-876e-4bd8-9bd5-70a30159f3ee\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n /* produção: /fonts/figtree-latin.woff2, nunca next/font/google */\n:root,.pnl-root{\n--bg:#EEF6F2;--bg-soft:#DDEDE5;--surface:#FCFEFD;\n--ink:#1F2D2A;--ink-soft:#5A6E68;--ink-faint:#8FA09A;\n--accent:#7CC9A9;--accent-strong:#3E9C7A;--accent-2:#D9CFEA;--accent-3:#F6E8D8;\n--line:rgba(31,45,42,.10);--line-strong:rgba(31,45,42,.18);\n--danger:#D97757;--warn:#E8A45A;\n--pro:#6F4FE8;--pro-soft:#ECE7FA;--pro-ink:#4B34A8;--pro-gradient:linear-gradient(135deg,var(--accent-strong),var(--pro));\n--pnl-shadow:0 12px 32px -14px rgba(62,156,122,.30);\n--pnl-shadow-soft:0 1px 2px rgba(31,45,42,.04),0 6px 18px -10px rgba(62,156,122,.22);\n--font:'Figtree',system-ui,-apple-system,sans-serif;\n}\n*,*::before,*::after{box-sizing:border-box}\n.pnl-root{font-family:var(- round:var(--bg-soft);color:var(--ink)}\n.pnl-btn-danger{background:var(--surface);color:var(--danger);border-color:var(--line-strong)}\n.pnl-btn-pro{background:var(--pro-gradient);color:#fff}.pnl-btn-pro:hover:not(:disabled){filter:brightness(1.06)}\n\n/* Campos — raio 12, 10×14, 13,5px */\n.pnl-field{display:flex;flex-direction:column;gap:5px}\n.pnl-label{font-size:13px;font-weight:600}\n.pnl-input,.pnl-select,.pnl-textarea{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}\n.pnl-textarea{min-height:96px;resize:vertical;line-height:1.5}\n.pnl-input:focus,.pnl-select:focus,.pnl-textarea:focus{border-color:var(--accent-strong);box-shadow:0 0 0 3px rgba(62,156,122,.18)}\n.pnl-input::placeholder,.pnl-textarea::placeholder{color:var(--ink-faint)}\n\n/* Superfícies */\n.pnl-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--pnl-shadow-soft)}\n.pnl-card-flush{padding:0;overflow:hidden}\n.pnl-kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}\n.pnl-list-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}.pnl-list-item:first-child{border-top:none}\n\n/* Tags */\n.pnl-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--bg-soft);color:var(--ink-soft);white-space:nowrap;line-height:1.4}\n.pnl-tag-ok{background:rgba(124,201,169,.25);color:#2B6F56}\n.pnl-tag-warn{background:rgba(232,164,90,.2);color:#8A5A1E}\n.pnl-tag-danger{background:rgba(217,119,87,.16);color:#A44E32}\n.pnl-pro-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--pro-soft);color:var(--pro-ink);white-space:nowrap;line-height:1.4}\n\n/* Toggle */\n.pnl-toggle{position:relative;width:40px;height:22px;border-radius:999px;background:var(--line-strong);border:none;padding:0;cursor:pointer;flex-shrink:0}\n.pnl-toggle::after{content:\"\";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}\n.pnl-toggle.on{background:var(--accent-strong)}.pnl-toggle.on::after{left:20px}\n\n/* Menu lateral — dashboard/app/painel/nav.js */\n.pnl-nav{display:flex;flex-direction:column;gap:2px}\n.pnl-nav .pnl-group-title{padding:14px 10px 6px}\n.pnl-nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;text-decoration:none}\n.pnl-nav-item:hover{background:var(--bg);color:var(--ink)}\n.pnl-nav-item.on{background:var(--bg-soft);color:var(--ink);font-weight:600}\n.pnl-nav-item.locked{color:var(--ink-faint)}\n.pnl-pro{margin-left:auto;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;background:var(--pro-soft);color:var(--pro-ink)}\n\n/* Padrão PRO — dashboard/components/pro/ProGate.js */\n.pnl-lock{position:relative}\n.pnl-lock>.pnl-lock-body{opacity:.5;filter:grayscale(1);pointer-events:none;user-select:none}\n.pnl-lock>.pnl-lock-hit{position:absolute;inset:0;background:transparent;border:none;cursor:pointer;border-radius:12px}\n.pnl-lock>.pnl-pro-tag{position:absolute;top:8px;right:8px;pointer-events:none}\n.pnl-banner-pro{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--pro-soft)}\n.pnl-banner-pro .t{font-size:13.5px;font-weight:700;color:var(--pro-ink)}\n.pnl-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}\n.pnl-step{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}\n.pnl-step-n{width:26px;height:26px;border-radius:50%;background:var(--pro-gradient);color:#fff;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}\n.pnl-modal-bg{position:absolute;inset:0;background:rgba(31,45,42,.4);display:flex;align-items:center;justify-content:center;padding:20px}\n.pnl-modal{width:100%;max-width:420px;background:var(--surface);border-radius:18px;box-shadow:var(--pnl-shadow);overflow:hidden}\n.pnl-icon-box{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-soft);color:var(--accent-strong);flex-shrink:0}\n.pnl-icon-box.pro{background:var(--pro-soft);color:var(--pro-ink)}\n<\u002Fstyle>\n\n<style>\nbody{margin:0;background:var(--bg);font-family:var(--font);color:var(--ink)}\na{color:var(--accent-strong)}a:hover{color:var(--ink)}\n.ds{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}\n.ds-nav{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;background:var(--surface);border-right:1px solid var(--line)}\n.ds-nav a{display:block;padding:6px 10px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-soft);text-decoration:none}.ds-nav a:hover{background:var(--bg);color:var(--ink)}\n.ds-main{padding:40px 48px 120px;max-width:1080px}\n.ds-sec{padding:36px 0;border-bottom:1px solid var(--line)}.ds-sec:last-child{border-bottom:none}\n.ds-h{font-size:24px;font-weight:900;letter-spacing:-.01em;margin:0 0 6px}\n.ds-p{font-size:14px;color:var(--ink-soft);max-width:680px;margin:0 0 20px;line-height:1.55}\n.demo{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}\n.demo.bg{background:var(--bg)}\n.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}\n.sw{display:flex;flex-direction:column;gap:6px;width:128px}.sw-c{height:56px;border-radius:12px;border:1px solid var(--line)}.sw b{font-size:12.5px}.sw span{font-size:11.5px;color:var(--ink-faint)}\n.spec{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}.spec:first-child{border-top:none}.spec code{font-family:var(--font);font-size:11.5px;color:var(--ink-faint);font-weight:600}\n.src{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-bottom:14px}\n.src b{color:var(--ink-soft);font-weight:700}\n.ok,.prop{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}.ok{background:rgba(124,201,169,.25);color:#2B6F56}.prop{background:var(--accent-3);color:#8A5A1E}\n.rule{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rule>div{padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;line-height:1.55}.rule b{display:block;margin-bottom:6px}.rule .no b{color:var(--danger)}.rule .yes b{color:var(--accent-strong)}\ntable.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:10px 16px;border-bottom:1px solid var(--line)}table.t td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:top}\n.ic{width:14px;height:14px;display:inline-block;vertical-align:-2px}\n@media (max-width:860px){.ds{grid-template-columns:1fr}.ds-nav{position:static;height:auto}.ds-main{padding:28px 18px}.spec{grid-template-columns:1fr;gap:6px}.rule{grid-template-columns:1fr}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\"><symbol id=\"lock\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><\u002Fpath><\u002Fsymbol><\u002Fsvg>\n<div class=\"ds\">\n<nav class=\"ds-nav pnl-root\">\n<div style=\"font-size:17px;font-weight:900;letter-spacing:-.01em\">Espelha Grupos<\u002Fdiv>\n<div class=\"pnl-hint\" style=\"margin:2px 0 18px\">Design System v2 · 23 set 2026<\u002Fdiv>\n<a href=\"#regra\">Regra de ouro<\u002Fa><a href=\"#principios\">Princípios<\u002Fa><a href=\"#cores\">Cores<\u002Fa><a href=\"#tipo\">Tipografia<\u002Fa><a href=\"#forma\">Forma e sombra<\u002Fa><a href=\"#botoes\">Botões<\u002Fa><a href=\"#campos\">Campos e controles<\u002Fa><a href=\"#cards\">Cards, KPIs e tags<\u002Fa><a href=\"#menu\">Menu lateral<\u002Fa><a href=\"#pagina\">Padrão de página<\u002Fa><a href=\"#pro\">Padrão PRO<\u002Fa><a href=\"#planos\">Planos e acesso<\u002Fa><a href=\"#copy\">Voz e texto<\u002Fa><a href=\"#checklist\">Checklist nova página<\u002Fa><a href=\"#testes\">Testes que guardam o DS<\u002Fa>\n<\u002Fnav>\n<main class=\"ds-main pnl-root\">\n<span class=\"pnl-group-title\" style=\"color:var(--accent-strong)\">Design System · v2<\u002Fspan>\n<h1 style=\"font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:10px 0 12px\">Simples para quem nunca usou um painel.<\u002Fh1>\n<p class=\"ds-p\" style=\"font-size:16px\">Uma fonte (Figtree), uma cor de ação (verde), um botão principal por tela. O roxo só aparece no que é PRO. Tudo aqui espelha o código em produção.<\u002Fp>\n\n<section id=\"regra\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Regra de ouro<\u002Fh2>\n<p class=\"ds-p\">Quando este documento e o código divergirem, <b>vale o código<\u002Fb>. As fontes de verdade são estes arquivos:<\u002Fp>\n<div class=\"pnl-card pnl-card-flush\">\n<table class=\"t\"><tbody>\n<tr><td style=\"width:44%;font-weight:600\">dashboard/app/globals.css <span class=\"pnl-hint\">(:root)<\u002Fspan><\u002Ftd><td class=\"pnl-note\">Tokens de cor, fonte<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">dashboard/app/painel/painel.css <span class=\"pnl-hint\">(.pnl-root)<\u002Fspan><\u002Ftd><td class=\"pnl-note\">Todas as classes <b>pnl-*<\u002Fb> do painel<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">dashboard/app/painel/nav.js<\u002Ftd><td class=\"pnl-note\">Grupos e itens do menu lateral<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">dashboard/components/pro/ProGate.js<\u002Ftd><td class=\"pnl-note\">ProTag, ProLock, ProModal, ProBanner, Steps, LockedPage<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">dashboard/lib/planFeatures.js<\u002Ftd><td class=\"pnl-note\">Quem tem acesso a quê (Basic × PRO)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">dashboard/public/fonts/figtree-latin.woff2<\u002Ftd><td class=\"pnl-note\">Figtree variável 300–900, servida pelo próprio site<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n<p class=\"pnl-note\" style=\"margin-top:12px\"><span class=\"ok\">no código<\u002Fspan> valor ou classe confirmada no código · <span class=\"prop\">aproximado<\u002Fspan> valor que não veio no relatório — confira em painel.css antes de copiar.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"principios\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Princípios<\u002Fh2>\n<div class=\"pnl-steps\">\n<div class=\"pnl-step\"><div class=\"pnl-step-n\" style=\"background:var(--accent-strong)\">1<\u002Fdiv><div class=\"pnl-card-title\">Uma ação por tela<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">Um só botão verde visível. O resto é secundário ou link.<\u002Fp><\u002Fdiv>\n<div class=\"pnl-step\"><div class=\"pnl-step-n\" style=\"background:var(--accent-strong)\">2<\u002Fdiv><div class=\"pnl-card-title\">Explique em uma frase<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">Título + uma linha. Detalhe vai para o vídeo \"Veja na prática\".<\u002Fp><\u002Fdiv>\n<div class=\"pnl-step\"><div class=\"pnl-step-n\" style=\"background:var(--accent-strong)\">3<\u002Fdiv><div class=\"pnl-card-title\">Cor só com significado<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">Verde = ação/ok. Roxo = PRO. Coral = erro. Âmbar = atenção.<\u002Fp><\u002Fdiv>\n<div class=\"pnl-step\"><div class=\"pnl-step-n\" style=\"background:var(--accent-strong)\">4<\u002Fdiv><div class=\"pnl-card-title\">PRO se mostra, não some<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">No Basic o recurso aparece com cadeado. Nunca tela em branco.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"cores\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Cores<\u002Fh2>\n<p class=\"ds-p\">Paleta atual mantida. O PRO é verde + roxo (gradiente). A paleta do protótipo (#2E8B66 etc.) <b>não<\u002Fb> foi adotada.<\u002Fp>\n<div class=\"src\"><span class=\"ok\">no código<\u002Fspan> globals.css · painel.css<\u002Fdiv>\n<div class=\"demo\">\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--bg)\"><\u002Fdiv><b>--bg<\u002Fb><span>#EEF6F2<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--bg-soft)\"><\u002Fdiv><b>--bg-soft<\u002Fb><span>#DDEDE5<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--surface)\"><\u002Fdiv><b>--surface<\u002Fb><span>#FCFEFD<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--ink)\"><\u002Fdiv><b>--ink<\u002Fb><span>#1F2D2A<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--ink-soft)\"><\u002Fdiv><b>--ink-soft<\u002Fb><span>#5A6E68<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--ink-faint)\"><\u002Fdiv><b>--ink-faint<\u002Fb><span>#8FA09A<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--line-strong)\"><\u002Fdiv><b>--line / -strong<\u002Fb><span>ink 10% / 18%<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"demo\" style=\"margin-top:12px\">\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--accent)\"><\u002Fdiv><b>--accent<\u002Fb><span>#7CC9A9<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--accent-strong)\"><\u002Fdiv><b>--accent-strong<\u002Fb><span>#3E9C7A · ação<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--accent-2)\"><\u002Fdiv><b>--accent-2<\u002Fb><span>#D9CFEA · lilás<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--accent-3)\"><\u002Fdiv><b>--accent-3<\u002Fb><span>#F6E8D8 · areia<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--danger)\"><\u002Fdiv><b>--danger<\u002Fb><span>#D97757<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--warn)\"><\u002Fdiv><b>--warn<\u002Fb><span>#E8A45A<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"demo\" style=\"margin-top:12px\">\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--pro)\"><\u002Fdiv><b>--pro<\u002Fb><span>#6F4FE8<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--pro-soft)\"><\u002Fdiv><b>--pro-soft<\u002Fb><span>#ECE7FA<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"background:var(--pro-ink)\"><\u002Fdiv><b>--pro-ink<\u002Fb><span>#4B34A8<\u002Fspan><\u002Fdiv>\n<div class=\"sw\" style=\"width:270px\"><div class=\"sw-c\" style=\"background:var(--pro-gradient)\"><\u002Fdiv><b>--pro-gradient<\u002Fb><span>135° accent-strong → pro · botões e passos PRO<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rule\" style=\"margin-top:12px\">\n<div class=\"yes\"><b>Faça<\u002Fb>--accent-strong no botão principal, toggle ligado e link. --accent só em fundos e ilustrações. Roxo exclusivamente no que é PRO.<\u002Fdiv>\n<div class=\"no\"><b>Evite<\u002Fb>--accent (#7CC9A9) como cor de texto — não tem contraste em fundo claro. Lilás --accent-2 para indicar PRO (use --pro-soft).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tipo\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Tipografia<\u002Fh2>\n<p class=\"ds-p\"><b>Figtree, uma fonte só, em todo o site<\u002Fb> — painel, admin e site público. Sem serif, sem mono em lugar nenhum (nem em link, credencial, variável de template ou código de pareamento). Tamanhos só em px.<\u002Fp>\n<div class=\"src\"><span class=\"ok\">no código<\u002Fspan> escala travada por test/painel-escala-de-fontes.test.js<\u002Fdiv>\n<div class=\"pnl-card\">\n<div class=\"spec\"><code>Título da página · 19/900 (17 no celular)<\u002Fcode><div class=\"pnl-title\">Ofertas automáticas<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Título de seção · 15/700<\u002Fcode><div class=\"pnl-section-title\">Temas que o robô procura<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Título de card · 13/600<\u002Fcode><div class=\"pnl-card-title\">Achados da Sol 💜<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Texto · 13–13,5/400<\u002Fcode><div class=\"pnl-text\">O robô procura promoções nas lojas por tema e publica sozinho.<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Nota · 11,5–12,5<\u002Fcode><div class=\"pnl-note\">247 membros · publica com o seu link<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Dica · 11<\u002Fcode><div class=\"pnl-hint\">Sem escolha, ele envia para todos os seus destinos.<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Etiqueta · 10,5/600–700<\u002Fcode><div class=\"row\" style=\"display:flex;gap:6px\"><span class=\"pnl-tag pnl-tag-ok\">ativo<\u002Fspan><span class=\"pnl-pro-tag\"><svg class=\"ic\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>KPI · 26–30/900<\u002Fcode><div class=\"pnl-kpi\">R$ 684<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Preço · 24/900<\u002Fcode><div class=\"pnl-price\">R$ 69<span class=\"pnl-note\" style=\"font-weight:400\">/mês<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Hero · 52/900<\u002Fcode><div class=\"pnl-kpi-hero\">1.284<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Item do menu · 13,5/500<\u002Fcode><div style=\"font-size:13.5px;font-weight:500\">Criar oferta<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Grupo do menu · 10,5/700 · caixa alta · .08em<\u002Fcode><div class=\"pnl-group-title\">Criar &amp; enviar<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><code>Código de pareamento · 900 tabular<\u002Fcode><div style=\"font-size:28px;font-weight:900;letter-spacing:.12em;font-variant-numeric:tabular-nums\">4K7P-92QX<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid2\" style=\"margin-top:16px\">\n<div class=\"pnl-card\"><div class=\"pnl-group-title\" style=\"margin-bottom:10px\">Pesos<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px\"><span style=\"font-weight:900\">900 · título de página, preço, número grande<\u002Fspan><span style=\"font-weight:700\">700 · título de seção, etiqueta<\u002Fspan><span style=\"font-weight:600\">600 · título de card, botão, label<\u002Fspan><span style=\"font-weight:400\">400 · texto<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"pnl-card\"><div class=\"pnl-group-title\" style=\"margin-bottom:10px\">Site público · destaque<\u002Fdiv><div style=\"font-size:30px;font-weight:900;line-height:1.1;letter-spacing:-.02em\">Seus grupos vendendo <span style=\"color:var(--accent-strong)\">sozinhos<\u002Fspan>.<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:10px\">A palavra em destaque é Figtree 900 na cor de destaque, <b>sem itálico<\u002Fb>. O itálico serif foi aposentado.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"forma\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Forma e sombra<\u002Fh2>\n<div class=\"src\"><span class=\"ok\">no código<\u002Fspan> raios · <span class=\"prop\">aproximado<\u002Fspan> valores exatos das sombras<\u002Fdiv>\n<div class=\"demo\">\n<div class=\"sw\"><div class=\"sw-c\" style=\"border-radius:18px;background:var(--bg-soft)\"><\u002Fdiv><b>18px<\u002Fb><span>card, modal, banner<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"border-radius:12px;background:var(--bg-soft)\"><\u002Fdiv><b>12px<\u002Fb><span>input, KPI, passo<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"border-radius:10px;background:var(--bg-soft)\"><\u002Fdiv><b>10px<\u002Fb><span>item do menu<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"sw-c\" style=\"border-radius:999px;background:var(--bg-soft)\"><\u002Fdiv><b>999px<\u002Fb><span>botão, tag<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"demo bg\" style=\"margin-top:12px;gap:24px\">\n<div style=\"width:220px;height:90px;border-radius:18px;background:var(--surface);box-shadow:var(--pnl-shadow-soft);display:flex;align-items:center;justify-content:center\" class=\"pnl-note\">--pnl-shadow-soft · cards<\u002Fdiv>\n<div style=\"width:220px;height:90px;border-radius:18px;background:var(--surface);box-shadow:var(--pnl-shadow);display:flex;align-items:center;justify-content:center\" class=\"pnl-note\">--pnl-shadow · modal, gaveta<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"pnl-note\" style=\"margin-top:10px\">Só duas sombras, as duas com tom verde. Nada de sombra neutra/cinza.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"botoes\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Botões<\u002Fh2>\n<p class=\"ds-p\">Sempre pílula, padding 9×16, 13/600. Um primário por tela. Desligado: opacidade .45 e cursor \"proibido\".<\u002Fp>\n<div class=\"demo\">\n<button class=\"pnl-btn pnl-btn-primary\">Salvar<\u002Fbutton>\n<button class=\"pnl-btn pnl-btn-secondary\">Cancelar<\u002Fbutton>\n<button class=\"pnl-btn pnl-btn-ghost\">Agora não<\u002Fbutton>\n<button class=\"pnl-btn pnl-btn-danger\">Excluir grupo<\u002Fbutton>\n<button class=\"pnl-btn pnl-btn-pro\">Ver planos<\u002Fbutton>\n<button class=\"pnl-btn pnl-btn-primary\" disabled=\"\">Salvar<\u002Fbutton>\n<\u002Fdiv>\n<p class=\"pnl-note\" style=\"margin-top:10px\">Nomes <span class=\"prop\">aproximado<\u002Fspan>: confira os modificadores reais em painel.css. O botão PRO usa <b>--pro-gradient<\u002Fb>.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"campos\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Campos e controles<\u002Fh2>\n<p class=\"ds-p\">Raio 12, padding 10×14, 13,5px. No foco: borda --accent-strong e anel de 3px.<\u002Fp>\n<div class=\"pnl-card\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n<div class=\"pnl-field\"><label class=\"pnl-label\">Link do produto<\u002Flabel><input class=\"pnl-input\" placeholder=\"Ex.: https://shopee.com.br/…\"><span class=\"pnl-hint\">Cole o link e o robô detecta a loja.<\u002Fspan><\u002Fdiv>\n<div class=\"pnl-field\"><label class=\"pnl-label\">Intervalo entre mensagens<\u002Flabel><select class=\"pnl-select\"><option>Entre 40 e 90 segundos<\u002Foption><\u002Fselect><\u002Fdiv>\n<div class=\"pnl-field\"><label class=\"pnl-label\">Mensagem de boas-vindas<\u002Flabel><textarea class=\"pnl-textarea\" placeholder=\"Ex.: Bem-vinda ao grupo 💜\"><\u002Ftextarea><\u002Fdiv>\n<div class=\"pnl-field\"><label class=\"pnl-label\">Toggle<\u002Flabel><div style=\"display:flex;gap:10px\"><button class=\"pnl-toggle on\" aria-label=\"ligado\"><\u002Fbutton><button class=\"pnl-toggle\" aria-label=\"desligado\"><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"cards\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Cards, KPIs e tags<\u002Fh2>\n<div class=\"grid2\">\n<div class=\"pnl-card pnl-card-flush\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)\"><span class=\"pnl-section-title\">Grupos que monitoro<\u002Fspan><button class=\"pnl-btn pnl-btn-secondary\">+ Adicionar<\u002Fbutton><\u002Fdiv>\n<div class=\"pnl-list-item\"><span class=\"pnl-icon-box\">PB<\u002Fspan><div style=\"flex:1\"><div class=\"pnl-card-title\">Promoções Brasil 🔥<\u002Fdiv><div class=\"pnl-note\">envia para Achados da Sol<\u002Fdiv><\u002Fdiv><span class=\"pnl-tag pnl-tag-ok\">ativo<\u002Fspan><\u002Fdiv>\n<div class=\"pnl-list-item\"><span class=\"pnl-icon-box\">CC<\u002Fspan><div style=\"flex:1\"><div class=\"pnl-card-title\">Cupons &amp; Cashback BR<\u002Fdiv><div class=\"pnl-note\">envia para todos<\u002Fdiv><\u002Fdiv><span class=\"pnl-tag pnl-tag-warn\">padrão: todos<\u002Fspan><\u002Fdiv>\n<div class=\"pnl-list-item\"><span class=\"pnl-icon-box\">AM<\u002Fspan><div style=\"flex:1\"><div class=\"pnl-card-title\">Achadinhos Mães<\u002Fdiv><div class=\"pnl-note\" style=\"color:var(--danger)\">nenhum destino escolhido<\u002Fdiv><\u002Fdiv><span class=\"pnl-tag pnl-tag-danger\">parado<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\"><div class=\"pnl-kpi-card\"><span class=\"pnl-kpi\">147<\u002Fspan><span class=\"pnl-note\">ofertas hoje<\u002Fspan><\u002Fdiv><div class=\"pnl-kpi-card\"><span class=\"pnl-kpi\" style=\"color:var(--accent-strong)\">R$ 96<\u002Fspan><span class=\"pnl-note\">comissão Shopee hoje<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"pnl-card\"><div class=\"pnl-card-title\">Card padrão<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">Raio 18, padding 20, borda --line e --pnl-shadow-soft.<\u002Fp><\u002Fdiv>\n<div class=\"demo\" style=\"padding:16px\"><span class=\"pnl-tag\">pausado<\u002Fspan><span class=\"pnl-tag pnl-tag-ok\">enviado<\u002Fspan><span class=\"pnl-tag pnl-tag-warn\">pendente<\u002Fspan><span class=\"pnl-tag pnl-tag-danger\">falha<\u002Fspan><span class=\"pnl-pro-tag\"><svg class=\"ic\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"menu\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Menu lateral<\u002Fh2>\n<p class=\"ds-p\">Valem os <b>nomes e a ordem antigos<\u002Fb>. Os 4 grupos do protótipo (Divulgar / Automatizar / Configurar / Conta) foram revertidos. Do protótipo ficou só o cadeado PRO e o item \"Minha conta\".<\u002Fp>\n<div class=\"src\"><span class=\"ok\">no código<\u002Fspan> nav.js · guardado por test/painel-sidebar-nav.test.js<\u002Fdiv>\n<div class=\"demo bg\" style=\"align-items:flex-start;gap:24px\">\n<div class=\"pnl-nav\" style=\"width:260px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 10px 14px\">\n<div style=\"padding:8px 10px 2px;font-size:15px;font-weight:900\">Espelha Grupos<\u002Fdiv>\n<div class=\"pnl-group-title\">Início<\u002Fdiv>\n<a class=\"pnl-nav-item on\">Painel<\u002Fa><a class=\"pnl-nav-item locked\">Vendas <span class=\"pnl-pro\"><svg class=\"ic\" style=\"width:10px;height:10px\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Fa>\n<div class=\"pnl-group-title\">Criar &amp; enviar<\u002Fdiv>\n<a class=\"pnl-nav-item\">Criar oferta<\u002Fa><a class=\"pnl-nav-item\">Espelhamento<\u002Fa><a class=\"pnl-nav-item locked\">Ofertas automáticas <span class=\"pnl-pro\"><svg class=\"ic\" style=\"width:10px;height:10px\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Fa><a class=\"pnl-nav-item\">Enviar agora<\u002Fa><a class=\"pnl-nav-item locked\">Filas <span class=\"pnl-pro\"><svg class=\"ic\" style=\"width:10px;height:10px\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Fa>\n<div class=\"pnl-group-title\">Acompanhar<\u002Fdiv>\n<a class=\"pnl-nav-item\">Envios<\u002Fa>\n<div class=\"pnl-group-title\">Configuração<\u002Fdiv>\n<a class=\"pnl-nav-item\">Conexão WhatsApp<\u002Fa><a class=\"pnl-nav-item\">Templates de mensagens<\u002Fa><a class=\"pnl-nav-item\">Cupons<\u002Fa><a class=\"pnl-nav-item\">Minhas credenciais<\u002Fa><a class=\"pnl-nav-item\">Testar conversão<\u002Fa><a class=\"pnl-nav-item\">Tutorial<\u002Fa>\n<div class=\"pnl-group-title\">Preservação avançada<\u002Fdiv>\n<a class=\"pnl-nav-item\">Monitoramento<\u002Fa><a class=\"pnl-nav-item\">Preservação por grupo e canal<\u002Fa><a class=\"pnl-nav-item\">Configurações avançadas<\u002Fa>\n<div class=\"pnl-group-title\">Conta<\u002Fdiv>\n<a class=\"pnl-nav-item\">Plano<\u002Fa><a class=\"pnl-nav-item\">Afiliados<\u002Fa><a class=\"pnl-nav-item\">Minha conta<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px\">\n<div class=\"pnl-card\"><div class=\"pnl-card-title\">Item<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">13,5/500, padding 8×10, raio 10. Ativo: fundo --bg-soft, 600. Travado no Basic: texto --ink-faint + <b>.pnl-pro<\u002Fb> (clica e abre a janela \"Ver planos\").<\u002Fp><\u002Fdiv>\n<div class=\"pnl-card\"><div class=\"pnl-card-title\">Título de grupo<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">10,5/700, caixa alta, .08em, --ink-faint.<\u002Fp><\u002Fdiv>\n<div class=\"pnl-card\"><div class=\"pnl-card-title\">Marca<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">\"Espelha Grupos\" em tudo. Nunca \"conversor.app\" nem \"BOTinho\".<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pagina\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Padrão de página<\u002Fh2>\n<p class=\"ds-p\">Cabeçalho (título 19/900 + uma frase) → \"Veja na prática\" → conteúdo. Lista vazia: o estado vazio ocupa o lugar do conteúdo, sempre com um botão.<\u002Fp>\n<div class=\"demo bg\" style=\"flex-direction:column;align-items:stretch;gap:14px\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px\"><div><div class=\"pnl-title\">Espelhamento<\u002Fdiv><div class=\"pnl-desc\">De quais grupos o robô pega ofertas e onde ele publica com o seu link.<\u002Fdiv><\u002Fdiv><button class=\"pnl-btn pnl-btn-primary\">+ Adicionar<\u002Fbutton><\u002Fdiv>\n<div class=\"pnl-card\" style=\"display:flex;align-items:center;gap:14px;padding:14px 18px\"><span class=\"pnl-icon-box\" style=\"border-radius:50%\">▶<\u002Fspan><div style=\"flex:1\"><div class=\"pnl-card-title\">Veja na prática: como funciona o espelhamento <span class=\"pnl-tag\" style=\"margin-left:6px\">3 min<\u002Fspan><\u002Fdiv><div class=\"pnl-note\">Escolha uma origem, um destino e deixe o robô reenviar por você.<\u002Fdiv><\u002Fdiv><a href=\"#\">Assistir<\u002Fa><\u002Fdiv>\n<div class=\"pnl-card\" style=\"text-align:center;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:8px\"><span class=\"pnl-icon-box\" style=\"width:52px;height:52px;border-radius:16px\">⇄<\u002Fspan><div class=\"pnl-section-title\">Nenhum grupo ainda<\u002Fdiv><p class=\"pnl-note\" style=\"max-width:420px\">Origem é de onde o robô pega ofertas; destino é onde ele publica com o seu link.<\u002Fp><div style=\"display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center\"><button class=\"pnl-btn pnl-btn-primary\">Adicionar grupo de origem<\u002Fbutton><button class=\"pnl-btn pnl-btn-secondary\">Adicionar grupo de destino<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pro\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Padrão PRO<\u002Fh2>\n<p class=\"ds-p\">No Basic, o recurso PRO <b>aparece<\u002Fb> — com cadeado — e nunca funciona. Todo clique em algo travado abre a janela \"Ver planos\".<\u002Fp>\n<div class=\"src\"><span class=\"ok\">no código<\u002Fspan> dashboard/components/pro/ProGate.js · prévias em previews.js · ritmo em RhythmCard.js<\u002Fdiv>\n<div class=\"pnl-card pnl-card-flush\" style=\"margin-bottom:16px\">\n<table class=\"t\"><thead><tr><th>Componente<\u002Fth><th>Quando usar<\u002Fth><th>Como fica<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td style=\"font-weight:600\">ProTag<\u002Ftd><td class=\"pnl-note\">Marcar um recurso PRO (ao lado do título, na opção).<\u002Ftd><td><span class=\"pnl-pro-tag\"><svg class=\"ic\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">.pnl-pro<\u002Ftd><td class=\"pnl-note\">Só no menu lateral.<\u002Ftd><td><span class=\"pnl-pro\" style=\"margin:0\"><svg class=\"ic\" style=\"width:10px;height:10px\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">ProLock<\u002Ftd><td class=\"pnl-note\">Controle PRO dentro de uma página do Basic. Opacidade .5 + grayscale; clique abre ProModal.<\u002Ftd><td class=\"pnl-note\">abaixo<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">ProBanner<\u002Ftd><td class=\"pnl-note\">Topo de página inteira travada. Título em --pro-ink.<\u002Ftd><td class=\"pnl-note\">abaixo<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">Steps<\u002Ftd><td class=\"pnl-note\">\"Como funciona em N passos\", círculos com --pro-gradient.<\u002Ftd><td class=\"pnl-note\">abaixo<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">LockedPage<\u002Ftd><td class=\"pnl-note\">Página PRO inteira no Basic: ProBanner → vídeo → Steps → prévia esmaecida.<\u002Ftd><td class=\"pnl-note\">Vendas · Ofertas automáticas · Filas<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">ProModal<\u002Ftd><td class=\"pnl-note\">A janela \"Ver planos\": o que o recurso faz + botão.<\u002Ftd><td class=\"pnl-note\">abaixo<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n<div class=\"grid2\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div class=\"pnl-banner-pro\"><span class=\"pnl-icon-box pro\" style=\"background:#fff\"><svg class=\"ic\" style=\"width:18px;height:18px\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg><\u002Fspan><div style=\"flex:1\"><div class=\"t\">Recurso PRO<\u002Fdiv><div class=\"pnl-note\">Atualize para o plano PRO para usar as filas de ofertas.<\u002Fdiv><\u002Fdiv><button class=\"pnl-btn pnl-btn-pro\">Ver planos<\u002Fbutton><\u002Fdiv>\n<div class=\"pnl-steps\">\n<div class=\"pnl-step\"><div class=\"pnl-step-n\">1<\u002Fdiv><div class=\"pnl-card-title\">Crie uma fila<\u002Fdiv><p class=\"pnl-hint\" style=\"margin-top:4px\">Dê um nome e escolha o destino.<\u002Fp><\u002Fdiv>\n<div class=\"pnl-step\"><div class=\"pnl-step-n\">2<\u002Fdiv><div class=\"pnl-card-title\">Adicione ofertas<\u002Fdiv><p class=\"pnl-hint\" style=\"margin-top:4px\">Cole links ou mande do Criar oferta.<\u002Fp><\u002Fdiv>\n<div class=\"pnl-step\"><div class=\"pnl-step-n\">3<\u002Fdiv><div class=\"pnl-card-title\">Defina o ritmo<\u002Fdiv><p class=\"pnl-hint\" style=\"margin-top:4px\">Ex.: 1 a cada 20 min, das 8h às 12h.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"pnl-lock\"><div class=\"pnl-lock-body pnl-card\" style=\"padding:16px\"><div class=\"pnl-card-title\">Frases que variam sozinhas<\u002Fdiv><p class=\"pnl-note\" style=\"margin-top:4px\">🔥 PARA TUDO E OLHA ISSO! · 😱 TÁ BARATO DEMAIS!<\u002Fp><\u002Fdiv><button class=\"pnl-lock-hit\" aria-label=\"Recurso PRO\"><\u002Fbutton><span class=\"pnl-pro-tag\"><svg class=\"ic\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;min-height:340px;border-radius:18px;overflow:hidden;background:var(--bg-soft)\">\n<div class=\"pnl-modal-bg\"><div class=\"pnl-modal\">\n<div style=\"padding:20px;display:flex;flex-direction:column;gap:12px\">\n<span class=\"pnl-icon-box pro\" style=\"width:46px;height:46px;border-radius:14px\"><svg class=\"ic\" style=\"width:20px;height:20px\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n<div style=\"display:flex;gap:8px;align-items:center\"><span class=\"pnl-section-title\">Sua marca d’água<\u002Fspan><span class=\"pnl-pro-tag\"><svg class=\"ic\"><use href=\"#lock\"><\u002Fuse><\u002Fsvg>PRO<\u002Fspan><\u002Fdiv>\n<p class=\"pnl-text\" style=\"color:var(--ink-soft)\">Seu logo no canto de todas as fotos das ofertas.<\u002Fp>\n<div style=\"background:var(--bg);border-radius:12px;padding:12px 14px\" class=\"pnl-note\">No PRO você também tem: canais, ofertas automáticas, filas e ritmo dos envios.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)\"><button class=\"pnl-btn pnl-btn-ghost\">Agora não<\u002Fbutton><button class=\"pnl-btn pnl-btn-pro\">Ver planos<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"pnl-card\" style=\"margin-top:16px\"><div class=\"pnl-section-title\" style=\"margin-bottom:10px\">Onde o cadeado aparece no Basic<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px\" class=\"pnl-text\">\n<div><b>Menu<\u002Fb><div class=\"pnl-note\">Vendas, Ofertas automáticas, Filas<\u002Fdiv><\u002Fdiv>\n<div><b>Gaveta do destino<\u002Fb><div class=\"pnl-note\">Marca d’água, \"Ver canal\"<\u002Fdiv><\u002Fdiv>\n<div><b>Mensagens<\u002Fb><div class=\"pnl-note\">Variação do texto<\u002Fdiv><\u002Fdiv>\n<div><b>WhatsApp<\u002Fb><div class=\"pnl-note\">Ritmo (edita o preset padrão da Preservação)<\u002Fdiv><\u002Fdiv>\n<div><b>Painel<\u002Fb><div class=\"pnl-note\">Card \"Comissão Shopee hoje\", embaçado<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"planos\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Planos e acesso<\u002Fh2>\n<p class=\"ds-p\">Quem vê o quê vem de <b>planFeatures.js<\u002Fb> — a tela nunca decide sozinha. Teste grátis ativo e Premium contam como PRO. Não existe \"Plano Grátis\" no menu.<\u002Fp>\n<div class=\"grid2\">\n<div class=\"pnl-card\" style=\"display:flex;flex-direction:column;gap:10px\"><span class=\"pnl-group-title\">Basic<\u002Fspan><div class=\"pnl-price\">R$ 39<span class=\"pnl-note\" style=\"font-weight:400\">/mês<\u002Fspan><\u002Fdiv>\n<div class=\"pnl-note\" style=\"display:flex;flex-direction:column;gap:5px\"><span>✓ Espelhamento de grupos<\u002Fspan><span>✓ Conversão de links de 6 lojas<\u002Fspan><span>✓ Card de oferta clicável<\u002Fspan><span>✓ Mensagem reescrita do seu jeito<\u002Fspan><span>✓ Envio imediato ou agendado<\u002Fspan><span>✓ Relatórios com histórico completo<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"pnl-card\" style=\"display:flex;flex-direction:column;gap:10px;border-color:var(--pro);box-shadow:0 0 0 3px var(--pro-soft)\"><span class=\"pnl-group-title\" style=\"color:var(--pro-ink)\">PRO<\u002Fspan><div class=\"pnl-price\">R$ 69<span class=\"pnl-note\" style=\"font-weight:400\">/mês<\u002Fspan><\u002Fdiv>\n<div class=\"pnl-note\" style=\"display:flex;flex-direction:column;gap:5px\"><span>✓ Tudo do Basic<\u002Fspan><span>✓ Espelhamento de grupos e CANAIS<\u002Fspan><span>✓ Ofertas automáticas (garimpo)<\u002Fspan><span>✓ Filas de ofertas<\u002Fspan><span>✓ Marca d’água e botão \"Ver canal\"<\u002Fspan><span>✓ Ritmo: descanso, máximo por dia, intervalo<\u002Fspan><span>✓ Variação do texto<\u002Fspan><span>✓ Painel de vendas Shopee<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"pnl-card\" style=\"margin-top:12px\"><div class=\"pnl-card-title\">Regras que a tela precisa respeitar<\u002Fdiv>\n<ul class=\"pnl-note\" style=\"margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n<li>Imagem por destino: \"Foto oficial da loja\" e \"Sem imagem\" <b>não existem<\u002Fb> (retiradas em 22/08).<\u002Fli>\n<li>Basic com \"preview + marca d’água\" passa a usar \"preview\"; com \"original + marca d’água\" passa a \"original\".<\u002Fli>\n<li>Ritmo não cria teto de conta novo: o controle edita o preset padrão da Preservação (vale para todos os destinos).<\u002Fli>\n<li>Premium (Instagram Stories) fica fora da tela Plano.<\u002Fli>\n<\u002Ful><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"copy\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Voz e texto<\u002Fh2>\n<p class=\"ds-p\">Falamos com quem não é de tecnologia. Frase curta, verbo no início. Guardado por test/painel-linguagem-leiga.test.js.<\u002Fp>\n<div class=\"rule\">\n<div class=\"yes\"><b>Escreva<\u002Fb>origem · destino · o robô pega · publica com o seu link · credenciais · envios · filas<\u002Fdiv>\n<div class=\"no\"><b>Nunca na tela<\u002Fb>monitor · post · jid · imageMode · template key · relay · preview<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"pnl-card pnl-card-flush\" style=\"margin-top:12px\"><table class=\"t\"><thead><tr><th>Código<\u002Fth><th>Tela diz<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td class=\"pnl-note\">role: 'monitor'<\u002Ftd><td style=\"font-weight:600\">origem<\u002Ftd><\u002Ftr>\n<tr><td class=\"pnl-note\">role: 'post'<\u002Ftd><td style=\"font-weight:600\">destino<\u002Ftd><\u002Ftr>\n<tr><td class=\"pnl-note\">credentials<\u002Ftd><td style=\"font-weight:600\">Minhas credenciais<\u002Ftd><\u002Ftr>\n<tr><td class=\"pnl-note\">templates<\u002Ftd><td style=\"font-weight:600\">Templates de mensagens<\u002Ftd><\u002Ftr>\n<tr><td class=\"pnl-note\">variáveis<\u002Ftd><td style=\"font-weight:600\">{gancho} {cta} {convitegrupo} … <span class=\"pnl-hint\">(sem variáveis novas)<\u002Fspan><\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"checklist\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Checklist para uma nova página<\u002Fh2>\n<div class=\"pnl-card pnl-card-flush\">\n<div class=\"pnl-list-item\">Classes <b>pnl-*<\u002Fb> dentro de .pnl-root, em painel.css. Nada de Tailwind no painel.<\u002Fdiv>\n<div class=\"pnl-list-item\">Figtree, só px, e só os tamanhos da escala (o teste de escala quebra se sair dela).<\u002Fdiv>\n<div class=\"pnl-list-item\">Título 19/900 + uma frase de descrição. Um botão primário.<\u002Fdiv>\n<div class=\"pnl-list-item\">Card \"Veja na prática\" e estado vazio com botão.<\u002Fdiv>\n<div class=\"pnl-list-item\">Recurso PRO? Leia o acesso de planFeatures.js e use ProLock / LockedPage — nunca esconda.<\u002Fdiv>\n<div class=\"pnl-list-item\">Configuração em gaveta (nível 2), nunca formulário aberto na lista.<\u002Fdiv>\n<div class=\"pnl-list-item\">Funciona em 375px: gaveta vira folha de tela cheia, sem largura fixa, sem tabela estourando.<\u002Fdiv>\n<div class=\"pnl-list-item\">Texto no vocabulário leigo. Nome \"Espelha Grupos\".<\u002Fdiv>\n<div class=\"pnl-list-item\">Item novo no menu entra em nav.js, num dos grupos existentes.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"testes\" class=\"ds-sec\">\n<h2 class=\"ds-h\">Testes que guardam o design system<\u002Fh2>\n<div class=\"pnl-card pnl-card-flush\"><table class=\"t\"><tbody>\n<tr><td style=\"font-weight:600;width:48%\">test/painel-escala-de-fontes.test.js<\u002Ftd><td class=\"pnl-note\">Tamanhos de fonte do painel<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">test/painel-sidebar-nav.test.js<\u002Ftd><td class=\"pnl-note\">Impede os rótulos do protótipo no menu<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">test/painel-linguagem-leiga.test.js<\u002Ftd><td class=\"pnl-note\">Jargão técnico na tela<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">test/image-mode-policy.test.js<\u002Ftd><td class=\"pnl-note\">Opções de imagem permitidas + jargão<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">test/dialogos-no-celular.test.js<\u002Ftd><td class=\"pnl-note\">Balões e tabelas em 375px<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:600\">test/groups-route-targets-mode.test.js<\u002Ftd><td class=\"pnl-note\">Destinos: lista vazia ≠ \"todos\"<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
