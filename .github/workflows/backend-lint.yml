name: Backend lint (no-undef)

# Rede de segurança que faltava: a CI existente (deploy.yml) só lintava o
# dashboard (Next) e nunca rodava lint no backend. Um merge mal resolvido
# deixou `dedupKeys` indefinido e quebrou o envio espelhado sem nada pegar.
# Este job roda ESLint com a regra no-undef em src/ + test/ em toda PR.
#
# Roda com `npx eslint` puro (sem `npm ci`): não instala deps do repo, não
# dispara o postinstall do Prisma e não depende do package-lock — só baixa o
# ESLint e usa o eslint.config.js (que não importa nada).

# Economia de minutos (2026-09-02): roda SÓ em pull_request. O gatilho `push`
# em main/develop era redundante — `main` só recebe merge de `develop`, que já
# foi lintado na PR, e com uma PR develop->main aberta todo push em develop
# disparava este workflow DUAS vezes no mesmo commit (uma por evento).
on:
  pull_request:
    branches: [ main, develop ]

# Push novo na mesma PR cancela o lint anterior — o resultado do commit antigo
# não interessa mais e ficava ocupando minuto do plano gratuito.
concurrency:
  group: backend-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-undef:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: ESLint no-undef (src + test + telas do dashboard)
        # `--no-inline-config`: as telas têm eslint-disable de regras de plugin
        # (react-hooks, @next/next) que não existem nesta config pura.
        run: npx --yes eslint@9 --no-inline-config src test dashboard/app dashboard/components dashboard/lib
