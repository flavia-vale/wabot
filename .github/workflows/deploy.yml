name: Deploy Automático Wabot

on:
  push:
    branches: [ main, develop ]
    # Economia de minutos (2026-09-02): mudança só de documentação não precisa
    # de deploy (nada em docs/ e specs/ é servido). NÃO incluir `**.md` aqui:
    # dashboard/public/pricing.md e dashboard/public/materiais/*.md SÃO
    # servidos publicamente e precisam subir. `*.md` casa só a raiz do repo.
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - '*.md'
  # Gate pré-merge (lint+build+smoke) das PRs de feature contra develop. A
  # etapa de SSH deploy é pulada (condição push-only).
  #
  # `main` foi REMOVIDO daqui de propósito (economia de minutos, 2026-09-02):
  # a PR develop->main carrega exatamente os commits que já rodaram este gate
  # ao entrar em develop, então re-executá-lo era build duplicado. Pior: com a
  # PR aberta, todo push em develop disparava este workflow duas vezes no MESMO
  # commit (uma vez por evento) — era o que o print de 5 checks mostrava.
  pull_request:
    branches: [ develop ]
  # Permite disparar manualmente pela UI do GitHub Actions ("Run workflow").
  # Útil para re-rodar deploy no HEAD atual de develop/main sem precisar de
  # commit novo (ex: quando uma execução antiga falhou em SHA já corrigido
  # por commits posteriores).
  workflow_dispatch:
    inputs:
      ref_label:
        description: 'Rótulo opcional para identificar este run nos logs (ex: "redeploy after lock fix")'
        required: false
        default: 'manual'
      pm2_update_during_deploy:
        description: 'Produção: rodar pm2 update? ATENÇÃO: recicla daemon, reinicia bot-supervisor e pode reconectar sessões WhatsApp.'
        type: boolean
        required: false
        default: false
      stop_supervisor_for_migration:
        description: 'Produção: parar bot-supervisor durante a migration (destrava SQLITE_BUSY quando modo=remote). ATENÇÃO: reconecta TODAS as sessões WhatsApp — anunciar antes. Só tem efeito num run manual; pushes automáticos preservam o supervisor (default seguro).'
        type: boolean
        required: false
        default: false

# Serializa deploys por branch/ambiente. Sem isto, merges em sequência rápida
# em develop (ou main) disparam workflows que rodam ao mesmo tempo no MESMO
# diretório do VPS (~/wabot-staging ou ~/wabot) e pisam no node_modules/.next
# um do outro — sintoma observado: build do dashboard falhando com
# "_webpack.WebpackError is not a constructor" + "rm: Directory not empty".
# cancel-in-progress:false faz os runs ENFILEIRAREM (nunca cancela um deploy
# no meio do SSH, o que deixaria o VPS num estado inconsistente).
#
# cancel-in-progress é FALSE em push (nunca cancelar um deploy no meio do SSH)
# e TRUE em pull_request: ali o run é só gate de CI, então push novo na mesma
# PR pode descartar o build do commit antigo sem risco nenhum.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: file:./prisma/ci.db

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Forçar dependências Git públicas via HTTPS
        run: |
          git config --global --replace-all url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      # ------------------------------------------------------------------
      # GATE DE CI — SÓ EM pull_request (economia de minutos, 2026-09-02).
      #
      # Em `push` estes passos eram trabalho jogado fora: gastavam ~1m50 do
      # runner com npm ci (raiz) + npm ci (dashboard) + lint + next build +
      # smoke e, logo em seguida, o `deploy_safe_*.sh` refazia EXATAMENTE isso
      # no VPS (npm ci, prisma, npm ci dashboard, rm -rf .next, npm run build).
      # Build duplicado, e o gate já tinha rodado na PR que originou o commit.
      #
      # O que se perde: o aviso antecipado antes de tocar o VPS. Quem reprova
      # um build quebrado passa a ser o próprio script de deploy, que aborta
      # (qualquer falha aborta — ver "Ordem do deploy automático" no AGENTS.md)
      # antes do restart do PM2. A PR continua com o gate completo.
      #
      # Os passos abaixo do SSH (Cloudflare, IndexNow) NÃO dependem de
      # node_modules — notify-indexnow.mjs só importa dashboard/lib/*.mjs puros.
      # ------------------------------------------------------------------
      - name: Instalar dependências da API sem alterar lockfile
        if: github.event_name == 'pull_request'
        run: |
          for attempt in 1 2 3; do
            echo "npm ci (API) — tentativa ${attempt}/3"
            if npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
              exit 0
            else
              # status precisa ser capturado no else: após um `if` sem ramo
              # executado, $? é 0 e o step "passaria" mesmo com npm ci quebrado.
              status=$?
            fi
            echo "::warning::npm ci (API) falhou na tentativa ${attempt}/3 com exit ${status}. Aguardando antes de tentar novamente..."
            npm cache verify || true
            sleep $((attempt * 10))
          done
          exit "${status:-1}"

      - name: Validar Prisma e gerar client
        if: github.event_name == 'pull_request'
        run: |
          npx prisma validate
          npx prisma generate

      - name: Instalar dependências do dashboard sem alterar lockfile
        if: github.event_name == 'pull_request'
        working-directory: dashboard
        run: |
          for attempt in 1 2 3; do
            echo "npm ci (dashboard) — tentativa ${attempt}/3"
            if npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
              exit 0
            else
              # status precisa ser capturado no else: após um `if` sem ramo
              # executado, $? é 0 e o step "passaria" mesmo com npm ci quebrado.
              status=$?
            fi
            echo "::warning::npm ci (dashboard) falhou na tentativa ${attempt}/3 com exit ${status}. Aguardando antes de tentar novamente..."
            npm cache verify || true
            sleep $((attempt * 10))
          done
          exit "${status:-1}"

      - name: Guardrail da página de configurações
        if: github.event_name == 'pull_request'
        working-directory: dashboard
        run: npm run guard:config-page

      # Validadores de SEO (23/09/2026). Existiam desde 05/2026 e não rodavam
      # em lugar nenhum: foi assim que 33 rotas ficaram sem data e /cadastro
      # sem noindex na metadata. Os três primeiros BLOQUEIAM (são erro de
      # código); o de frescor só AVISA — página velha se resolve revisando o
      # conteúdo, e bloquear deploy pela passagem do tempo treinaria a pular o
      # gate. Mesmo conjunto roda em `npm test` (test/seo-validadores-gate.test.js).
      - name: Validadores de SEO (hard gate)
        if: github.event_name == 'pull_request'
        working-directory: dashboard
        run: |
          npm run validate:seo-p0
          npm run validate:seo-consistency

      - name: Frescor editorial (aviso, não bloqueia)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: dashboard
        run: npm run validate:editorial-freshness

      - name: Lint do dashboard
        if: github.event_name == 'pull_request'
        working-directory: dashboard
        run: npm run lint

      - name: Build Check do dashboard (hard gate)
        if: github.event_name == 'pull_request'
        working-directory: dashboard
        run: |
          rm -rf .next
          npm run build

      - name: Verificar artefatos críticos do build
        if: github.event_name == 'pull_request'
        run: node scripts/verify-dashboard-api-proxy.mjs

      - name: Smoke mobile local do dashboard
        if: github.event_name == 'pull_request'
        run: |
          cd dashboard
          npm run start -- -H 127.0.0.1 -p 4016 > /tmp/wabot-next-start.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4016/login >/dev/null; then
              break
            fi
            sleep 1
          done
          cd ..
          scripts/smoke_mobile_dashboard.sh http://127.0.0.1:4016 / /login

      # Deploy via SSH só executa em push/workflow_dispatch — nunca em PR.
      # Isso garante que o gate de CI acima rode antes do merge,
      # e o deploy aconteça somente após o código entrar na branch.
      - name: Deploy via SSH
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # O default do appleboy é command_timeout=10m, curto demais para um
          # deploy "limpo" (npm install do zero na raiz + dashboard + build
          # completo do Next + respawn do PM2). Já estourou exatamente no passo
          # [8/9] PM2 status, deixando o smoke [9/9] sem rodar. 25m dá folga sem
          # mascarar travamento real.
          command_timeout: 25m
          script: |
            set -euo pipefail
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🚀 Enviando para PRODUÇÃO..."
              cd ~/wabot
              REPO_PULL_TOKEN_CLEAN="$(printf '%s' "${{ secrets.REPO_PULL_TOKEN }}" | tr -d '[:space:]')"
              if [ -n "$REPO_PULL_TOKEN_CLEAN" ]; then
                git remote set-url origin "https://x-access-token:${REPO_PULL_TOKEN_CLEAN}@github.com/${{ github.repository }}.git"
              else
                git remote set-url origin "git@github.com:${{ github.repository }}.git"
              fi
              # Referência do "ANTES" do deploy, capturada OBRIGATORIAMENTE antes
              # do reset abaixo. É com ela que o script decide se este deploy
              # trouxe código que os bot-workers executam (e portanto se o
              # bot-supervisor precisa reiniciar para o fix valer).
              #
              # RCA 2026-08-31 — NÃO REMOVER, NÃO MOVER PARA DEPOIS DO RESET:
              # o reset inline abaixo já deixa o clone no commit novo, então o
              # script, ao medir HEAD por conta própria, obtinha o MESMO commit
              # dos dois lados. O diff saía vazio, a decisão virava "nenhuma
              # mudança em código dos bots" e o supervisor NUNCA era reiniciado
              # em produção — todo fix de bot-worker.js chegava ao disco e
              # ficava dormente na memória dos workers. Staging não tinha o
              # reset inline, e por isso a mesma lógica funcionava lá.
              REVISION_BEFORE_DEPLOY="$(git rev-parse HEAD 2>/dev/null || true)"
              # Hard reset inline para resolver divergência antes de chamar o script
              # (necessário quando o VPS tem commits locais que bloqueiam ff-only).
              git fetch origin main
              git checkout main
              git reset --hard origin/main
              git clean -fd
              chmod +x ./scripts/deploy_safe_dashboard.sh
              # PRESERVE_SUPERVISOR_DURING_MIGRATION: '1' (preserva sessões WA)
              # por default em TODO push automático. Só vira '0' num run manual
              # com o input stop_supervisor_for_migration marcado — usado para
              # destravar uma migration presa em SQLITE_BUSY (modo=remote). Ligar
              # reconecta TODAS as sessões WhatsApp; anunciar antes.
              REVISION_BEFORE_DEPLOY="$REVISION_BEFORE_DEPLOY" \
              PM2_UPDATE_DURING_DEPLOY="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pm2_update_during_deploy == 'true' && '1' || '0' }}" \
              PRESERVE_SUPERVISOR_DURING_MIGRATION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stop_supervisor_for_migration == 'true' && '0' || '1' }}" \
                ROOT_DIR=~/wabot BRANCH=main FORCE_RESET_ON_SYNC=1 ./scripts/deploy_safe_dashboard.sh
            else
              echo "🧪 Enviando para STAGING..."
              cd ~/wabot-staging
              REPO_PULL_TOKEN_CLEAN="$(printf '%s' "${{ secrets.REPO_PULL_TOKEN }}" | tr -d '[:space:]')"
              if [ -n "$REPO_PULL_TOKEN_CLEAN" ]; then
                git remote set-url origin "https://x-access-token:${REPO_PULL_TOKEN_CLEAN}@github.com/${{ github.repository }}.git"
              else
                git remote set-url origin "git@github.com:${{ github.repository }}.git"
              fi
              chmod +x ./scripts/deploy_safe_staging.sh
              # Mesma referência do "ANTES" de produção. Aqui o sync é feito pelo
              # próprio script, mas passar o commit mantém as duas pontas com a
              # mesma regra em vez de duas regras parecidas.
              REVISION_BEFORE_DEPLOY="$(git rev-parse HEAD 2>/dev/null || true)" \
                ROOT_DIR=~/wabot-staging BRANCH=develop SYNC_GIT=1 AUTO_STASH_ON_DIRTY=1 FORCE_RESET_ON_SYNC=1 ./scripts/deploy_safe_staging.sh
            fi

      # Purga o cache da Cloudflare em todo deploy de PRODUÇÃO.
      # Necessário para poder cachear o HTML das páginas públicas na borda com
      # TTL longo sem risco: a cada deploy o HTML antigo (que aponta para chunks
      # JS com hash que já foram removidos do .next) é invalidado, evitando
      # servir página quebrada. Só roda em main — prod está atrás da Cloudflare;
      # staging é acessada por IP, fora da CF. No-op silencioso se os secrets
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID não estiverem configurados.
      #
      # `always()` é o conserto do RCA 2026-09-10 — NÃO REGREDIR. O smoke roda
      # DENTRO do passo de SSH (etapa 9/9 do deploy_safe_dashboard.sh) e lê a
      # home ATRAVÉS da Cloudflare. Um 404 cacheado na borda (a home devolveu
      # 404 na janela de restart do Next de um deploy anterior e a CF guardou a
      # resposta) reprova o smoke de um deploy que subiu certo — e, com a purga
      # condicionada ao sucesso, o passo que consertaria o cache nunca rodava.
      # Ciclo fechado: cache velho reprova o deploy, deploy reprovado não limpa
      # o cache, e a home fica 404 para as visitantes até alguém purgar na mão.
      # Purgar nunca piora nada: a borda só volta a buscar do servidor, que é a
      # fonte da verdade. Por isso ela roda mesmo com o passo anterior vermelho.
      - name: Purgar cache da Cloudflare (produção)
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "⚠️  CLOUDFLARE_API_TOKEN/CLOUDFLARE_ZONE_ID não configurados — pulando purge (sem erro)."
            exit 0
          fi
          echo "🧹 Limpando cache da Cloudflare (purge_everything)..."
          for attempt in 1 2 3; do
            resp="$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')"
            if printf '%s' "$resp" | grep -q '"success":true'; then
              echo "✅ Cache da Cloudflare limpo."
              exit 0
            fi
            echo "Tentativa ${attempt} falhou: ${resp}"
            sleep $((attempt * 3))
          done
          echo "❌ Falha ao limpar o cache da Cloudflare após 3 tentativas. O DEPLOY foi concluído; refaça o purge manualmente no painel da Cloudflare (Caching → Purge Everything)."
          exit 1

      # Notifica o IndexNow (Bing, Yandex, DuckDuckGo) com a lista de URLs
      # públicas indexáveis a cada deploy de PRODUÇÃO. A chave de verificação
      # (arquivo público em dashboard/public/<chave>.txt) não é segredo — é
      # publicada de propósito para o IndexNow validar posse do domínio — por
      # isso não depende de secret do GitHub. Só roda em main; staging não é
      # indexado. Falha aqui não bloqueia o deploy (a etapa de SSH já rodou).
      # continue-on-error: o comentário acima sempre disse que falha aqui não
      # bloqueia o deploy, mas sem esta linha o `exit 1` do script derrubava o
      # workflow inteiro — o deploy aparecia como FALHO mesmo tendo concluído
      # (a etapa de SSH roda antes). O step continua ficando amarelo/vermelho
      # quando falha, então o sinal não se perde; só deixa de reprovar a
      # promoção para main. O purge da Cloudflare acima NÃO ganha o mesmo
      # tratamento de propósito: cache velho é problema visível para o cliente
      # e merece reprovar o workflow.
      - name: Notificar IndexNow (produção)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/notify-indexnow.mjs

