script: |
            set -e
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🚀 Enviando para PRODUÇÃO..."
              cd ~/wabot
              # 1. Força a troca para SSH antes de qualquer outra coisa
              git remote set-url origin git@github.com:flavia-vale/wabot.git
              # 2. Limpa o ambiente
              git reset --hard HEAD
              # 3. Tenta o pull (agora via SSH)
              git pull origin main
              npm install
              npx prisma migrate deploy
              pm2 restart api dashboard
            else
              echo "🧪 Enviando para STAGING..."
              cd ~/wabot-staging
              # 1. Força a troca para SSH
              git remote set-url origin git@github.com:flavia-vale/wabot.git
              # 2. Limpa o ambiente
              git reset --hard HEAD
              git clean -fd
              # 3. Tenta o pull
              git pull origin develop
              npm install
              cd dashboard && npm install && cd ..
              npx prisma migrate deploy
              pm2 restart api-staging visual-staging
            fi
