- name: Deploy via SSH
uses: appleboy/ssh-action@v1.0.3
with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🚀 Enviando para PRODUÇÃO..."
              cd ~/wabot-prod
              # Garante SSH e limpa o ambiente
              git remote set-url origin git@github.com:flavia-vale/wabot.git
              git reset --hard HEAD
              git pull origin main
              npm install
              npx prisma migrate deploy
              pm2 restart api dashboard
            else
              echo "🧪 Enviando para STAGING..."
              cd ~/wabot-staging
              # Garante SSH e limpa arquivos como o dev.db-journal
              git remote set-url origin git@github.com:flavia-vale/wabot.git
              git reset --hard HEAD
              git clean -fd
              git pull origin develop
              npm install
              cd dashboard && npm install && cd ..
              npx prisma migrate deploy
              pm2 restart api-staging visual-staging
            fi
