name: Deploy Automático Wabot

on:
  push:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Node.js e Testar Build
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Dependências e Build Check
        run: |
          npm install
          cd dashboard && npm install && npm run build --if-present

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            # Função para garantir que o Git use SSH e não peça senha
            prepare_git() {
              git config --local --unset-all url."https://github.com/".insteadOf || true
              git remote set-url origin git@github.com:flavia-vale/wabot.git
            }

            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🚀 Enviando para PRODUÇÃO..."
              cd ~/wabot
              prepare_git
              git reset --hard HEAD
              git pull git@github.com:flavia-vale/wabot.git main
              npm install
              npx prisma migrate deploy
              pm2 restart api dashboard
            else
              echo "🧪 Enviando para STAGING..."
              cd ~/wabot-staging
              prepare_git
              git reset --hard HEAD
              git clean -fd
              git pull git@github.com:flavia-vale/wabot.git develop
              npm install
              cd dashboard && npm install && cd ..
              npx prisma migrate deploy
              pm2 restart api-staging visual-staging
            fi
