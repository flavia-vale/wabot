name: Deploy Automático Wabot

on:
  push:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Instalar Node.js e Testar Build
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      # Se houver erro de sintaxe aqui, o deploy para!
      - run: cd dashboard && npm install && npm run build --if-present

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🚀 Enviando para PRODUÇÃO..."
              cd ~/wabot-prod
              git pull origin main
              npm install
              npx prisma migrate deploy
              pm2 restart api dashboard
            else
              echo "🧪 Enviando para STAGING..."
              cd ~/wabot-staging
              git pull origin develop
              npm install
              cd dashboard && npm install && cd ..
              npx prisma migrate deploy
              pm2 restart api-staging visual-staging
            fi
