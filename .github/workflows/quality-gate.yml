name: Quality gate

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # sqlite3 CLI é pré-requisito dos testes de migration (aplicam o SQL de
      # verdade) e dos testes de backup. ubuntu-latest normalmente já o traz;
      # instalar explicitamente torna o gate determinístico e documenta a
      # dependência — sem ele esses testes se auto-skipam (hasSqlite3()) e o
      # gate deixaria de exercê-los.
      - run: sudo apt-get update && sudo apt-get install -y sqlite3

      - run: npm ci

      # Alguns testes renderizam componentes do painel de verdade
      # (test/helpers/render-jsx-component.js usa o compilador do Next que vive
      # em dashboard/node_modules). Sem esta instalação eles falham em TODA PR,
      # não por instabilidade: o módulo simplesmente não existe no runner.
      # Descoberto em 27/08, depois que o painel de capacidade entrou no
      # develop e passou a deixar o gate vermelho para todo mundo.
      - run: npm ci --prefix dashboard

      - run: npm test

      - run: npm run arch:check
