name: Quality gate

on:
  pull_request:
    branches:
      - develop
      - main

# Economia de minutos (2026-09-02): push novo na mesma PR cancela a execução
# anterior. Antes, uma PR com 5 commits enfileirava 5 suites completas (~2,5min
# cada) e o resultado das 4 primeiras já não interessava a ninguém.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Use the same runtime as deploy and backend-lint. Running the full
          # suite on an older major made CI disagree with the runtime that
          # actually executes the application (and with local validation).
          node-version: 24

      # sqlite3 CLI é pré-requisito dos testes de migration (aplicam o SQL de
      # verdade) e dos testes de backup. ubuntu-latest normalmente já o traz;
      # instalar explicitamente torna o gate determinístico e documenta a
      # dependência — sem ele esses testes se auto-skipam (hasSqlite3()) e o
      # gate deixaria de exercê-los.
      - run: sudo apt-get update && sudo apt-get install -y sqlite3

      - run: npm ci

      # Não dependa apenas do lifecycle postinstall: o gate precisa provar de
      # forma explícita que o client usado pelos testes corresponde ao schema
      # deste checkout. Um client antigo transformava campos novos (como
      # Group.targetsMode) em 500 e fazia várias suítes parecerem quebradas ao
      # mesmo tempo.
      - run: npx prisma generate

      # Alguns testes renderizam componentes do painel de verdade
      # (test/helpers/render-jsx-component.js usa o compilador do Next que vive
      # em dashboard/node_modules). Sem esta instalação eles falham em TODA PR,
      # não por instabilidade: o módulo simplesmente não existe no runner.
      # Descoberto em 27/08, depois que o painel de capacidade entrou no
      # develop e passou a deixar o gate vermelho para todo mundo.
      - run: npm ci --prefix dashboard

      # Mantém CI e diagnóstico local no mesmo comando. Assim, uma correção
      # pode ser validada com `npm run quality:gate` antes de abrir/reexecutar
      # o PR, sem esquecer a checagem de arquitetura.
      - run: npm run quality:gate
